name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc cmake binwalk
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: cd build && ctest --output-on-failure
      - name: Regenerate demo rootfs (deterministic perms)
        run: bash scripts/gen_demo_rootfs.sh
      - name: Integration test (end-to-end on demo rootfs)
        run: bash tests/test_integration.sh
